version: 2

before:
  hooks:
    - sh -c "cd frontend && npm ci && npm run build"

builds:
  - main: ./cmd/g5s
    dir: backend
    binary: g5s
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

release:
  prerelease: auto # -beta / -rc tags land as prereleases

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
